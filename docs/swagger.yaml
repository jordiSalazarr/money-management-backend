host: localhost:8019
info:
  contact: {}
  description: Personal money management API. Manage wallets, deposits, withdrawals,
    and transfers. All monetary amounts are in integer cents.
  title: Money Management API
  version: "1.0"
paths:
  /debts:
    get:
      description: Returns debts for the authenticated user. Filterable by wallet_id,
        direction, and status.
      parameters:
      - description: Filter by wallet ID
        in: query
        name: wallet_id
        type: string
      - description: Filter by direction (IN or OUT)
        in: query
        name: direction
        type: string
      - description: Filter by status (created)
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_getdebts.Response'
        "401":
          description: unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List debts
      tags:
      - Debts
    post:
      consumes:
      - application/json
      description: Records a new debt (someone owes you or you owe someone). Amount
        in integer cents.
      parameters:
      - description: Debt recording payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payments_debt_slices_recorddebt.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_recorddebt.Response'
        "400":
          description: Validation error (invalid_amount, invalid_currency, invalid_direction,
            missing_reason)
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_recorddebt.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_recorddebt.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_recorddebt.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record a debt
      tags:
      - Debts
  /debts/{id}/settle:
    post:
      consumes:
      - application/json
      description: Marks a debt as settled and triggers a wallet deposit or withdrawal
        via outbox.
      parameters:
      - description: Debt ID
        in: path
        name: id
        required: true
        type: string
      - description: Settle payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payments_debt_slices_settledebt.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_settledebt.Response'
        "400":
          description: Validation error (missing_settled_by, debt_already_settled)
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_settledebt.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_settledebt.ErrorResponse'
        "404":
          description: debt_not_found
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_settledebt.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_debt_slices_settledebt.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Settle a debt
      tags:
      - Debts
  /movements:
    get:
      description: Returns all movements (deposits, withdrawals, transfers in/out)
        across all wallets for the authenticated user, sorted by most recent first.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payments_wallet_slices_getusermovements.Response'
        "401":
          description: unauthorized
          schema:
            type: object
      security:
      - BearerAuth: []
      summary: List user movements
      tags:
      - Movements
  /recurring-movements:
    post:
      consumes:
      - application/json
      description: Creates a recurring deposit or withdrawal on a wallet. Amount in
        integer cents.
      parameters:
      - description: Recurring movement payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payments_recurringmovement_slices_recordrecurringmovement.Request'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_recordrecurringmovement.Response'
        "400":
          description: Validation error
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_recordrecurringmovement.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_recordrecurringmovement.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_recordrecurringmovement.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Record a recurring movement
      tags:
      - RecurringMovements
  /recurring-movements/{id}/stop:
    post:
      consumes:
      - application/json
      description: Stops an active recurring movement so it will no longer be executed.
      parameters:
      - description: Recurring movement ID
        in: path
        name: id
        required: true
        type: string
      - description: Optional reason
        in: body
        name: body
        schema:
          $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.Request'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.Response'
        "400":
          description: not_active
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.ErrorResponse'
        "403":
          description: not_owner
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.ErrorResponse'
        "404":
          description: recurring_movement_not_found
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_recurringmovement_slices_stoprecurringmovement.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Stop a recurring movement
      tags:
      - RecurringMovements
  /transfers:
    post:
      consumes:
      - application/json
      description: Requests a move of money between two wallets and returns immediately
        with 202. The transfer is carried out asynchronously in two steps and may
        still fail; poll GET /transfers/{id} for the outcome. A failed transfer moves
        no money. Amount is in integer cents.
      parameters:
      - description: Transfer payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.Request'
      produces:
      - application/json
      responses:
        "202":
          description: Accepted
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.Response'
        "400":
          description: Validation error (invalid_amount, same_wallet, currency_mismatch,
            insufficient_funds)
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.ErrorResponse'
        "401":
          description: unauthorized
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.ErrorResponse'
        "404":
          description: wallet_not_found
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.ErrorResponse'
        "409":
          description: wallet_disabled
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_requesttransfer.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Request a transfer
      tags:
      - Transfers
  /transfers/{id}:
    get:
      description: Reports where a transfer got to. "requested" and "debited" are
        in flight; "completed", "failed" and "stuck" are final. A failed transfer
        moved no money. A stuck transfer moved money that could not be returned, and
        needs intervention.
      parameters:
      - description: Transfer ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_gettransfer.Response'
        "404":
          description: transfer_not_found
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_gettransfer.ErrorResponse'
        "500":
          description: internal_error
          schema:
            $ref: '#/definitions/internal_payments_processes_transfer_slices_gettransfer.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a transfer
      tags:
      - Transfers
  /voice/audio:
    post:
      consumes:
      - multipart/form-data
      description: Accepts a WAV (PCM 16-bit mono) clip, transcribes it via AWS Transcribe,
        then interprets and executes the command.
      parameters:
      - description: WAV audio (PCM 16-bit mono)
        in: formData
        name: audio
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_voice.voiceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_voice.voiceResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/internal_voice.voiceResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_voice.voiceResponse'
      security:
      - BearerAuth: []
      summary: Process a spoken voice command
      tags:
      - voice
  /voice/command:
    post:
      consumes:
      - application/json
      description: Interprets natural-language text and executes the corresponding
        action. Used by the typed-input path; the speech path posts audio to /voice/audio
        instead.
      parameters:
      - description: Voice command
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/internal_voice.voiceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
