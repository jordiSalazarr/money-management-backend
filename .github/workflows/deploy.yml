name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  GO_VERSION: '1.25'
  AWS_REGION: eu-west-1
  PAYMENTS_FN: mm-payments-dev
  PROJECTOR_FN: mm-projector-dev
  MIGRATE_FN: mm-migrate-dev
  REACTOR_FN: mm-reactor-dev
  RECURRING_CRON_FN: mm-recurring-cron-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    services:
      localstack:
        image: localstack/localstack:3
        ports:
          - 4566:4566
        env:
          SERVICES: dynamodb
          DEFAULT_REGION: eu-west-1
        options: >-
          --health-cmd "curl -fsS http://localhost:4566/_localstack/health || exit 1"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
          --health-start-period 10s
    env:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: eu-west-1
      AWS_ENDPOINT_URL: http://localhost:4566
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: go vet
        run: go vet ./...
      - name: go test
        run: go test ./...

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
      - name: Build all Lambda zips
        run: make build-all-lambdas
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update payments Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$PAYMENTS_FN" \
            --zip-file fileb://lambda.zip
          aws lambda wait function-updated --function-name "$PAYMENTS_FN"
      - name: Update projector Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$PROJECTOR_FN" \
            --zip-file fileb://projector.zip
          aws lambda wait function-updated --function-name "$PROJECTOR_FN"
      - name: Update migrate Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$MIGRATE_FN" \
            --zip-file fileb://migrate.zip
          aws lambda wait function-updated --function-name "$MIGRATE_FN"
      - name: Update reactor Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$REACTOR_FN" \
            --zip-file fileb://reactor.zip
          aws lambda wait function-updated --function-name "$REACTOR_FN"
      - name: Update recurring-cron Lambda
        run: |
          aws lambda update-function-code \
            --function-name "$RECURRING_CRON_FN" \
            --zip-file fileb://recurring-cron.zip
          aws lambda wait function-updated --function-name "$RECURRING_CRON_FN"
      - name: Run migrations
        run: |
          aws lambda invoke \
            --function-name "$MIGRATE_FN" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            migrate-response.json \
            >/dev/null
          echo "migrate response:"
          cat migrate-response.json
          # Fail the job if the response carries an errorMessage.
          if grep -q errorMessage migrate-response.json; then
            echo "migration failed"; exit 1
          fi
      - name: Show payments configuration
        run: |
          aws lambda get-function-configuration \
            --function-name "$PAYMENTS_FN" \
            --query '{Version:Version,LastModified:LastModified,LastUpdateStatus:LastUpdateStatus,Runtime:Runtime,Architectures:Architectures}'
