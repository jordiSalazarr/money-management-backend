services:
  postgres:
    image: postgres:16-alpine
    container_name: money-management-db
    environment:
      POSTGRES_USER: money
      POSTGRES_PASSWORD: money
      POSTGRES_DB: money_management
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money -d money_management"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
